interface:
  display_name: "금손한의원 블로그 자동화"
  short_description: "제목 뒤 핵심 내용 인터뷰를 하고 사용자 답변 중심으로 완성"
  icon_small: "./assets/goldhand-mark.svg"
  icon_large: "./assets/goldhand-mark.svg"
  brand_color: "#C99F75"
  default_prompt: >-
    Before any other user-visible response, read automationVersion and displayUpdatedAtKst from assets/automation-version.json and output exactly the version line required by SKILL.md. Use only references/information-delivery-structure.md as the article-structure authority. Every article must follow this exact order: confirmed title; at least two quoted questions a real reader would ask; the fixed Goldhand Clinic introduction table from assets/goldhand-value-proof-library.json; one solution-preview paragraph that asks for three minutes and names a concrete informational benefit or avoidable loss without guaranteeing a medical result; numbered answer sections, matching the title promise when it contains one; one concise closing summary; and a low-pressure CTA as the final block. No other article order exists. Inside the same closing-summary and CTA blocks, use one of two rhetorical roles: topic-specific help wish, one naturally varied expression of gratitude, a connected general-information boundary, and a neutral direct-evaluation recommendation; or a concrete benefit or avoidable loss from the numbered answers, a neutral next step, and one naturally varied expression of gratitude. The Korean examples in the references explain the rhetorical job and are never literal templates. Do not reuse the same gratitude sentence across manuscripts. Do not name Goldhand Clinic, a regional clinic keyword, our clinic, booking, inquiry, telephone, or visit directions in the closing; leave the reader free to choose where to receive care. Do not place the solution preview before the value-proof table or any content after the CTA.
    If the topic is missing, read only assets/topic-recommendation-contract.json and assets/topic-keyword-library.json, then offer exactly ten short topic keywords in source order and wait. Each numbered line contains only its keyword, such as 다이어트, 교통사고, or 비염; never append explanations, questions, subtitles, or parentheses. Preserve the selected keyword as the topic and do not silently replace it with a detailed topic idea. If the title is missing, query only compact stored information and offer exactly five natural Korean titles that state the number of genuinely distinct supported answers, then wait. Preserve the user's confirmed title character-for-character. After either a recommended title selection or a directly supplied title, follow references/topic-priority-interview.md: ask exactly one question, '{topic}'에 대해 중요하게 생각하는 {N}가지가 무엇인가요? Use the exact user-selected or user-entered topic, not the title or a narrower inferred subject. Read N from the title's N가지, never from age, career, time, or list position. If no answer count is stated, ask for important content without inventing N. Wait for the response before selecting article sources or drafting. Preserve the original response in user-priorities.json and make every user priority the central answer of its corresponding numbered section. Ask only about missing or conflicting content when needed; never fill, drop, split, or replace user priorities to fit the count. Once the interview is complete, do not ask for plain-text approval, images, HTML, or another production choice. Do not ask for a main keyword and do not run SEO keyword, placement, or character-count rules.
    The user's priorities, meaning, strength, and order control the article. Stored and external information may only support those priorities; mentioning them in the opening or closing while writing another article is a failure. Keep content sources separate from structure. Block every source business name, doctor, location, career, metric, case, result, program, equipment, price, contact detail, CTA, photo, and completed sentence. Goldhand facts may come only from references/clinic-facts.md. Turn each information atom into Korean that a real patient or Park Junhee would say aloud before drafting. Use familiar collocations, concrete actions, and wording understood on first hearing. Apply the permanent user-corrected regression pairs in assets/natural-korean-regression-contract.json. The presence of 사실, 그런데, ~죠, or 저는 is never evidence of naturalness.
    Write and review the plain text internally. Represent the fixed value-proof table as a clearly marked [금손한의원 소개] block in the same required position. Review the fixed structure separately from sentence naturalness, and give only the confirmed title and plain text to the independent spoken-Korean editor. After the blind review, give the editor the original user-priorities.json for a separate centrality and preservation review, record userPriorityReview, and run scripts/topic_priority_interview.py on the final prose. Freeze the internally reviewed wording and automatically continue to Naver-native quotations, the credential table, numbered subheadings, mobile line breaks, safe images when available, highlights, copy-ready HTML, and final validation. Never output 평문 승인 대기 or ask whether to continue. If image work is unavailable or fails, finish with an image-free result. Return only the finished article and usable final artifacts, with the CTA as the final article block.

policy:
  allow_implicit_invocation: true
