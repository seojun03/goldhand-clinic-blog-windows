interface:
  display_name: "금손한의원 블로그 자동화"
  short_description: "제목 확정 뒤 질문 없이 생활어 검수와 네이버 제작까지 완료"
  icon_small: "./assets/goldhand-mark.svg"
  icon_large: "./assets/goldhand-mark.svg"
  brand_color: "#C99F75"
  default_prompt: >-
    Before any other user-visible response, read automationVersion and displayUpdatedAtKst from assets/automation-version.json and output exactly the version line required by SKILL.md. Use only references/information-delivery-structure.md as the article-structure authority. Every article must follow this exact order: confirmed title; at least two quoted questions a real reader would ask; the fixed Goldhand Clinic introduction table from assets/goldhand-value-proof-library.json; one solution-preview paragraph that asks for three minutes and names a concrete informational benefit or avoidable loss without guaranteeing a medical result; numbered answer sections, matching the title promise when it contains one; one concise closing summary; and a low-pressure CTA as the final block. No other article order exists. Inside the same closing-summary and CTA blocks, use one of two rhetorical roles: topic-specific help wish, one naturally varied expression of gratitude, a connected general-information boundary, and a neutral direct-evaluation recommendation; or a concrete benefit or avoidable loss from the numbered answers, a neutral next step, and one naturally varied expression of gratitude. The Korean examples in the references explain the rhetorical job and are never literal templates. Do not reuse the same gratitude sentence across manuscripts. Do not name Goldhand Clinic, a regional clinic keyword, our clinic, booking, inquiry, telephone, or visit directions in the closing; leave the reader free to choose where to receive care. Do not place the solution preview before the value-proof table or any content after the CTA.
    If the topic is missing, read only assets/topic-recommendation-contract.json and assets/topic-keyword-library.json, then offer exactly ten short topic keywords in source order and wait. Each numbered line contains only its keyword, such as 다이어트, 교통사고, or 비염; never append explanations, questions, subtitles, or parentheses. Preserve the selected keyword as the topic and do not silently replace it with a detailed topic idea. If the title is missing, query only compact stored information and offer exactly five natural Korean titles that state the number of genuinely distinct supported answers, then wait. Preserve the user's confirmed title character-for-character. Title confirmation is the final user-input gate: after it, never ask for an answer count, plain-text approval, images, HTML, or any other choice. If the confirmed title has no numeric promise, determine a supported positive answer count internally. Do not ask for a main keyword and do not run SEO keyword, placement, or character-count rules.
    Keep content sources separate from structure. Block every source business name, doctor, location, career, metric, case, result, program, equipment, price, contact detail, CTA, photo, and completed sentence. Goldhand facts may come only from references/clinic-facts.md. Turn each information atom into Korean that a real patient or Park Junhee would say aloud before drafting. Use familiar collocations, concrete actions, and wording understood on first hearing. Apply the permanent user-corrected regression pairs in assets/natural-korean-regression-contract.json. The presence of 사실, 그런데, ~죠, or 저는 is never evidence of naturalness.
    Write and review the plain text internally. Represent the fixed value-proof table as a clearly marked [금손한의원 소개] block in the same required position. Review the fixed structure separately from sentence naturalness, and give only the confirmed title and plain text to the independent spoken-Korean editor. Freeze the internally reviewed wording and automatically continue to Naver-native quotations, the credential table, numbered subheadings, mobile line breaks, safe images when available, highlights, copy-ready HTML, and final validation. Never output 평문 승인 대기 or ask whether to continue. If image work is unavailable or fails, finish with an image-free result. Return only the finished article and usable final artifacts, with the CTA as the final article block.

policy:
  allow_implicit_invocation: true
