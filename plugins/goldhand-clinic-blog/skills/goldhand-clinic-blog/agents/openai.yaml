interface:
  display_name: "금손한의원 블로그 자동화"
  short_description: "레퍼런스 흐름을 금손 정보로 바꾸고 writing-voice로 최종 검수합니다"
  icon_small: "./assets/goldhand-mark.svg"
  icon_large: "./assets/goldhand-mark.svg"
  brand_color: "#C99F75"
  default_prompt: >-
    Use $goldhand-clinic-blog to choose and atomically reserve one reviewed Wipark informational post that does not repeat the newest three completed topics or a reference already reserved by another active task.
    Before drafting, read references/reference-editorial-reasoning.md and the selected referenceWritingIntelligence profile. Treat the selected post as one content-and-editorial reference: infer why its title device attracts attention, why its opening lowers effort or creates curiosity, what topic-specific payoff keeps the reader, why each information beat follows the previous one, which micro-expression functions create self-identification or trust, and what recap and emotion close the article. Do not average multiple references or replace this reading experience with one universal Goldhand template.
    A phrase such as a two- or three-minute reading invitation is not a fixed formula. Understand the psychological chain specific number -> perceived concreteness -> low effort -> attention -> topic-specific payoff. Use a one-to-five-minute number only when the real article density and the selected profile support that device, and pair it with a visible payoff unique to the topic. Otherwise choose another allowed opening device such as contrast, urgency boundary, everyday loss, knowledge gap, or an effort-result contradiction. Never reuse the same three-minute sentence across articles.
    Use orderedContentAtoms as the factual skeleton and flowBeats as the editorial sequence. Create an internal decision card for reader state, title device and its psychology, opening device and payoff, beat-to-Goldhand mapping and transitions, source-fact-slot replacement or omission, and closing emotion. Carry microExpressionPatterns as functions, not copied sentences.
    Block every source sentence, seven-word consecutive overlap, source clinic fact, credential, patient count, career number, case, result, program, and media item. Replace a source authority slot only with a topic-relevant fact explicitly present in clinic-facts.md; otherwise omit the number and create trust through Goldhand's concrete examination, explanation, safety, or recheck process. Use authoritative medical information where needed.
    Use goldhand-official-voice-v1 to naturalize the adapted reasoning without erasing it. Write as Park Junhee speaking to one patient: concrete daily movements, direct answers, candid limits, and varied conversational endings. Block ㅎㅎ, ㅠㅠ, ^^, emoji, translated indirect commands, reader-homework prompts, abstract poetic payoffs, lesson-like endings, symmetric caveat templates, treatment-name catalogs, and abstract compressed wording. Replace phrases such as 걸을 때 남는 통증 with observable Korean that states when, during which movement, where, and how it hurts.
    Build the title from one allowed titleMechanism. A numbered answer promise is optional; when used, it must match the actual numbered answers. Any career, experience, patient, or performance number must be present in Goldhand evidence and relevant to the topic. Validate with the selected reference master ID and title mechanism ID.
    Mark solution-preview with one allowed data-intro-persuasion-device and a visible data-reader-payoff. Only the specific-number-low-friction-topic-payoff device may contain one reading-time-hook with a matching one-to-five-minute value. Mark the article with the selected writing profile, intelligence ID, title mechanism, and closing mechanism. Mark exactly one neutral-close with a visible data-closing-payoff and adapt the selected closing emotion instead of repeating the same neutral ending.
    First complete plain natural prose without SEO, HTML, images, highlighting, or mobile line breaks. Run a separate spoken-editor pass with the decision card, atoms, Goldhand facts, and draft, preserving the learned rhetorical functions. After the content, order, medical boundaries, and reference mechanisms pass, add the exact body keyword two or three times without adding filler.
    Then use the $writing-voice skill bundled inside this plugin for the final writing-voice rehear pass defined by references/final-writing-voice-review.md and writing-voice-final-rehear-v1. Freeze the title, atoms, flow order, facts, medical boundaries, claim strength, reference title/opening/flow/closing mechanisms, keyword promise, and fixed production components. Read the complete visible prose at speaking speed. Revise only local wording where generic connective tissue, flattened rhythm, attention drift, unsupported polish, or over-sanitized certainty makes Park Junhee harder to hear. Do not add, remove, reorder, promote, or demote material. Do not force an edit when the prose already passes. For every changed paragraph, record exact before and after text plus the expressive job beyond "sounds better," then rehear the whole draft. Validate the final review record before adding centered mobile two-to-three-line groups, images, tables, and fixed goldhand-naver-native-v4 components. Mark only a passed article with data-writing-voice-review=writing-voice-final-rehear-v1 and data-writing-voice-status=pass.
    Preserve the fixed Goldhand credential table after the complete introduction and before the first information-body divider or heading. Keep the fixed clinic information table unchanged as the final article component. Do not append a related-reading label, latest Naver blog link or card, Naver map or place component, or a placeholder for any of them.
    Search the user-owned callilife OGQ library for one to three topic-matched image references and generate local GPT Image outputs under the existing media contract. Also insert six to twelve approved bundled Goldhand director-patient treatment, examination, consultation, explanation, or test photos. Never use a logo, sign, building, medicine, packaged product, equipment, or empty clinic-space photo. Place every image after a directly related paragraph and add no visible caption.
    Validate reference-writing intelligence, title mechanism, optional numeric promise, opening device and topic payoff, adaptive reading time when used, flow and atom coverage, closing mechanism, Goldhand voice, spoken naturalness, the final writing-voice rehear record and its frozen-material checks, source-copy distance, medical safety, fixed credential placement, clinic-info final placement, absence of every lower supplement, media provenance, and final copy HTML. Record the selected mechanisms, reference, topic, and media IDs/hashes. Release the reservation after successful state recording or immediately when the task fails.

policy:
  allow_implicit_invocation: true
